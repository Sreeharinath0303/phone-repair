<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RepairVafe Customer Access - Manage your repairs" />
  <title>Customer Login - RepairVafe</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --clr-customer: #6366f1; }
    .btn-customer { background: var(--clr-customer); color: white; border: none; }
    .btn-customer:hover { background: #4f46e5; }
    .btn-outline-customer { border: 2px solid var(--clr-customer); color: var(--clr-customer); background: transparent; }
    .auth-tab.active { border-bottom-color: var(--clr-customer); color: var(--clr-customer); }
    .auth-hidden { display: none !important; }
    .method-switch { display: flex; gap: 10px; margin-bottom: 20px; }
    .method-switch button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
  </style>
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="lb-orb lb-orb-1" style="background: var(--clr-customer)"></div>
    <div class="lb-grid"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card" id="authCard">
      <div class="login-logo">
        <div class="logo-icon" style="background: var(--clr-customer)">🛠️</div>
        <span>Repair<strong>Vafe</strong></span>
      </div>

      <div class="auth-switch" id="authSwitch">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="setMode('login')">Login</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="setMode('signup')">Sign Up</button>
      </div>

      <div class="login-header">
        <h1 id="authTitle">Welcome Back</h1>
        <p id="authSubtitle">Log in to track your repairs</p>
      </div>

      <!-- AUTHENTICATION METHOD SWITCHER (Hidden - Email only mode) -->
      <div class="method-switch" id="methodSwitch" style="display: none !important;"></div>

      <!-- ================= MOBILE AUTH FLOW (HIDDEN) ================= -->
      <form class="login-form auth-hidden" id="mobileForm" style="display:none !important;"></form>
      <form class="login-form auth-hidden" id="mobileOtpForm" style="display:none !important;"></form>

      <!-- ================= EMAIL AUTH FLOW ================= -->

      <!-- EMAIL LOGIN FORM -->
      <form class="login-form auth-hidden" id="emailLoginForm" onsubmit="handleEmailLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap"><span class="input-icon">✉️</span><input type="email" class="form-input" id="loginEmail" placeholder="email@example.com" required /></div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" class="form-input" id="loginPass" placeholder="Enter password" required /></div>
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="emailLoginBtn">Log In</button>
        <div style="text-align:right; margin-top:10px"><a href="#" onclick="setMode('forgot')" style="color:var(--clr-customer); font-size:0.9rem">Forgot Password?</a></div>
      </form>

      <!-- EMAIL SIGNUP FORM -->
      <form class="login-form auth-hidden" id="emailSignupForm" onsubmit="handleEmailSignup(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="Enter your name" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="email@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Create Password</label>
          <input type="password" class="form-input" id="signupPass" minlength="8" placeholder="Min 8 characters" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="emailSignupBtn">Create Account</button>
      </form>

      <!-- EMAIL SIGNUP OTP VERIFY FORM -->
      <form class="login-form auth-hidden" id="emailOtpForm" onsubmit="handleEmailVerify(event)">
        <div class="login-header" style="text-align:center">
          <div style="font-size:3rem; margin-bottom:10px">✉️</div>
          <h2>Verify Email</h2>
          <p>Enter the 6-digit code sent to your email</p>
        </div>
        <div class="form-group">
          <input type="text" class="form-input" id="emailOtpCode" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align:center; font-size:1.5rem; letter-spacing:10px" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="emailOtpBtn">Verify & Complete Signup</button>
      </form>

      <!-- FORGOT PASSWORD FORM -->
      <form class="login-form auth-hidden" id="forgotForm" onsubmit="handleForgot(event)">
        <div class="login-header">
          <h2>Reset Password</h2>
          <p>We'll send an OTP to your email or mobile</p>
        </div>
        <div class="form-group">
          <label class="form-label">Email or Mobile</label>
          <input type="text" class="form-input" id="forgotId" placeholder="Enter registered email/mobile" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="forgotBtn">Send Reset OTP</button>
        <div style="text-align:center; margin-top:15px"><a href="#" onclick="setMode('login')" style="color:var(--clr-customer)">Back to Login</a></div>
      </form>

      <!-- RESET PASSWORD FORM -->
      <form class="login-form auth-hidden" id="resetForm" onsubmit="handleReset(event)">
        <div class="login-header">
          <h2>Create New Password</h2>
          <p>Enter the OTP and your new secure password</p>
        </div>
        <div class="form-group">
          <label class="form-label">OTP</label>
          <input type="text" class="form-input" id="resetOtp" placeholder="6-digit OTP" maxlength="6" required />
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-input" id="newPass" placeholder="Min 8 characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="resetBtn">Update Password</button>
      </form>


      <div class="login-footer">
        <a href="../../index.html">← Go Back Home</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = (['localhost', '127.0.0.1', ''].includes(window.location.hostname))
      ? 'http://localhost:5000/api'
      : '/api';
    const API = `${API_BASE}/customer-auth`;
    let currentMode = 'login'; // 'login' or 'signup'
    let currentMethod = 'email'; // Always email (mobile OTP hidden)
    let activeIdentity = ''; // Stores mobile or email temporarily

    async function storeSession(token) {
      if (!token) return;
      localStorage.setItem('rv_token', token);
      localStorage.setItem('rv_role', 'customer');
      // Backward compatibility for older HTML dashboard code
      localStorage.setItem('rv_user_token', token);

      try {
        const meRes = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
        const meData = await meRes.json();
        if (meData?.success && meData.data) localStorage.setItem('rv_user', JSON.stringify(meData.data));
      } catch {
        // no-op
      }
    }

    function redirectAfterAuth() {
      const qs = new URLSearchParams(window.location.search);
      const redirect = qs.get('redirect');
      if (redirect) return (window.location.href = redirect);
      window.location.href = 'customer-dashboard.html';
    }

    // Core UI switchers
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login' || mode === 'forgot');
      document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
      
      const titles = { login: 'Welcome Back', signup: 'Join RepairVafe', forgot: 'Reset Access' };
      const subs = { login: 'Log in to track your repairs', signup: 'Create an account for faster booking', forgot: 'Regain access to your account' };
      
      document.getElementById('authTitle').textContent = titles[mode] || 'RepairVafe';
      document.getElementById('authSubtitle').textContent = subs[mode] || '';
      renderForms();
    }

    function setMethod(method) {
      currentMethod = method;
      const btnMob = document.getElementById('btnMethodMobile');
      const btnEmail = document.getElementById('btnMethodEmail');
      
      btnMob.className = method === 'mobile' ? 'btn-customer' : 'btn-outline-customer';
      btnEmail.className = method === 'email' ? 'btn-customer' : 'btn-outline-customer';
      renderForms();
    }

    function hideAllForms() {
      const forms = ['mobileForm', 'mobileOtpForm', 'emailLoginForm', 'emailSignupForm', 'emailOtpForm', 'forgotForm', 'resetForm'];
      forms.forEach(f => document.getElementById(f).classList.add('auth-hidden'));
      document.getElementById('methodSwitch').style.display = 'flex';
      document.getElementById('authSwitch').style.display = 'grid';
    }

    function renderForms() {
      hideAllForms();
      if (currentMode === 'forgot') {
        document.getElementById('methodSwitch').style.display = 'none';
        document.getElementById('forgotForm').classList.remove('auth-hidden');
        return;
      }

      if (currentMethod === 'mobile') {
        document.getElementById('mobileForm').classList.remove('auth-hidden');
      } else if (currentMethod === 'email') {
        if (currentMode === 'login') document.getElementById('emailLoginForm').classList.remove('auth-hidden');
        if (currentMode === 'signup') document.getElementById('emailSignupForm').classList.remove('auth-hidden');
      }
    }

    // --- Mobile Auth Logic ---
    async function handleMobileRequest(e) {
      e.preventDefault();
      activeIdentity = document.getElementById('mobileInput').value.trim();
      const btn = document.getElementById('mobileBtn');
      btn.textContent = 'Sending...';
      btn.disabled = true;

      const res = await callApi('/mobile-otp', { phone: activeIdentity });
      btn.textContent = 'Send OTP';
      btn.disabled = false;

      if (res.success) {
        showToast('OTP Sent successfully to ' + activeIdentity, 'success');
        hideAllForms();
        document.getElementById('methodSwitch').style.display = 'none';
        document.getElementById('authSwitch').style.display = 'none';
        document.getElementById('mobileOtpForm').classList.remove('auth-hidden');
      }
    }

    async function handleMobileVerify(e) {
      e.preventDefault();
      const otp = document.getElementById('mobileOtpCode').value.trim();
      const res = await callApi('/verify-mobile-otp', { phone: activeIdentity, otp });
      if (res.success) {
        await storeSession(res.token);
        showToast('Authentication Successful!', 'success');
        setTimeout(() => redirectAfterAuth(), 800);
      }
    }

    // --- Email Auth Logic ---
    async function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const res = await callApi('/login', { email, password: pass });
      
      if (res.success) {
        await storeSession(res.token);
        if (res.mustResetPassword) {
            showToast('Security Alert: Administrative password reset required.', 'info');
            activeIdentity = email;
            hideAllForms();
            document.getElementById('methodSwitch').style.display = 'none';
            document.getElementById('authSwitch').style.display = 'none';
            document.getElementById('forgotForm').classList.add('auth-hidden');
            document.getElementById('resetForm').classList.remove('auth-hidden');
            // We set currentMode to login so they can go back if they want, but reset is shown
        } else {
            showToast('Login Successful!', 'success');
            setTimeout(() => redirectAfterAuth(), 800);
        }
      } else if (res.unverified) {
        activeIdentity = email;
        hideAllForms();
        document.getElementById('methodSwitch').style.display = 'none';
        document.getElementById('emailOtpForm').classList.remove('auth-hidden');
      }
    }

    async function handleEmailSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      activeIdentity = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPass').value;

      const res = await callApi('/register', { name, email: activeIdentity, password: pass });
      if (res.success) {
        showToast('Verification code sent to email', 'success');
        hideAllForms();
        document.getElementById('methodSwitch').style.display = 'none';
        document.getElementById('authSwitch').style.display = 'none';
        document.getElementById('emailOtpForm').classList.remove('auth-hidden');
      }
    }

    async function handleEmailVerify(e) {
      e.preventDefault();
      const otp = document.getElementById('emailOtpCode').value.trim();
      const res = await callApi('/verify-registration', { email: activeIdentity, otp });
      if (res.success) {
        await storeSession(res.token);
        showToast('Email Verified & Account Ready!', 'success');
        setTimeout(() => redirectAfterAuth(), 800);
      }
    }

    // --- Forgot/Reset Password Logic ---
    async function handleForgot(e) {
      e.preventDefault();
      activeIdentity = document.getElementById('forgotId').value.trim();
      const btn = document.getElementById('forgotBtn');
      btn.textContent = 'Processing...'; btn.disabled = true;

      const res = await callApi('/forgot-password', { loginId: activeIdentity });
      btn.textContent = 'Send Reset OTP'; btn.disabled = false;

      if (res.success) {
        showToast('Reset OTP sent successfully', 'success');
        hideAllForms();
        document.getElementById('methodSwitch').style.display = 'none';
        document.getElementById('authSwitch').style.display = 'none';
        document.getElementById('resetForm').classList.remove('auth-hidden');
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const otp = document.getElementById('resetOtp').value.trim();
      const newPassword = document.getElementById('newPass').value;
      const btn = document.getElementById('resetBtn');
      btn.textContent = 'Updating...'; btn.disabled = true;

      const res = await callApi('/reset-password', { email: activeIdentity, otp, newPassword });
      btn.textContent = 'Update Password'; btn.disabled = false;

      if (res.success) {
        showToast('Password updated successfully! Please login.', 'success');
        setMode('login');
      }
    }

    // Utilities
    async function callApi(path, body) {
      try {
        const res = await fetch(API + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!data.success && !data.unverified) showToast(data.message, 'error');
        return data;
      } catch (err) {
        showToast('Network error', 'error');
        return { success: false };
      }
    }

    function showToast(m, t) {
      const el = document.createElement('div');
      el.className = 'toast ' + t;
      el.textContent = m;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // Initialize: show email login form by default
    renderForms();
  </script>
</body>
</html>
