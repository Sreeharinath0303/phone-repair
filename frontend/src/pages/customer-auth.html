<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RepairVafe Customer Access - Manage your repairs" />
  <title>Customer Login - RepairVafe</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --clr-customer: #6366f1; }
    .btn-customer { background: var(--clr-customer); color: white; }
    .auth-tab.active { border-bottom-color: var(--clr-customer); color: var(--clr-customer); }
    .auth-hidden { display: none !important; }
  </style>
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="lb-orb lb-orb-1" style="background: var(--clr-customer)"></div>
    <div class="lb-grid"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card" id="authCard">
      <div class="login-logo">
        <div class="logo-icon" style="background: var(--clr-customer)">🛠️</div>
        <span>Repair<strong>Vafe</strong></span>
      </div>

      <div class="auth-switch" id="authSwitch">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="switchMode('login')">Login</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="switchMode('signup')">Sign Up</button>
      </div>

      <div class="login-header">
        <h1 id="authTitle">Welcome Back</h1>
        <p id="authSubtitle">Log in to track your device repairs</p>
      </div>

      <!-- LOGIN FORM -->
      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email or Mobile Number</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" class="form-input" id="loginId" placeholder="email@example.com or 9999999999" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input" id="loginPass" placeholder="Enter password" required />
          </div>
        </div>
        <div style="text-align:right; margin-bottom:15px">
          <a href="#" class="forgot-link" onclick="switchMode('forgot')">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="loginBtn">Continue ➔</button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="login-form auth-hidden" id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="Enter your name" required />
        </div>
        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="signupEmail" required></div>
          <div class="form-group"><label class="form-label">Mobile</label><input type="tel" class="form-input" id="signupPhone" required></div>
        </div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="signupPass" minlength="8" required></div>
        <div class="form-group"><label class="form-label">Address</label><input type="text" class="form-input" id="signupAddr" placeholder="Street, Area" required></div>
        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px">
          <input type="text" class="form-input" id="signupCity" placeholder="City" required>
          <input type="text" class="form-input" id="signupState" placeholder="State" required>
          <input type="text" class="form-input" id="signupPin" placeholder="Pincode" required>
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="signupBtn">Create Account</button>
      </form>

      <!-- OTP VERIFICATION FORM -->
      <form class="login-form auth-hidden" id="otpForm" onsubmit="handleOTP(event)">
        <div class="login-header" style="text-align:center">
          <div style="font-size:3rem; margin-bottom:10px">📲</div>
          <h2>Verify your account</h2>
          <p id="otpMsg">Enter the 6-digit code sent to your email</p>
        </div>
        <div class="form-group">
          <input type="text" class="form-input" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align:center; font-size:1.5rem; letter-spacing:10px" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="otpBtn">Verify & Proceed</button>
        <p style="text-align:center; font-size:0.8rem; margin-top:15px; color:var(--clr-text-muted)">
          Didn't receive it? <a href="#" onclick="resendOTP()" style="color:var(--clr-customer)">Resend</a>
        </p>
      </form>

      <!-- FORGOT PASSWORD FORM -->
      <form class="login-form auth-hidden" id="forgotForm" onsubmit="handleForgot(event)">
        <div class="form-group">
          <label class="form-label">Account Email or Mobile</label>
          <input type="text" class="form-input" id="forgotId" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="forgotBtn">Send Reset OTP</button>
        <div style="text-align:center; margin-top:15px">
           <a href="#" onclick="switchMode('login')" style="color:var(--clr-customer)">← Back to Login</a>
        </div>
      </form>

       <!-- RESET PASSWORD FORM -->
       <form class="login-form auth-hidden" id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-input" id="resetPass" minlength="8" required />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-input" id="resetPassConfirm" required />
        </div>
        <button type="submit" class="btn btn-customer btn-full" id="resetBtn">Change Password</button>
      </form>

      <div class="login-footer">
        <a href="../../index.html">← Use as Guest</a>
        <span class="divider">·</span>
        <a href="login.html">Admin Portal</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../utils/auth.js"></script>
  <script>
    const API = 'http://localhost:5000/api/customer-auth';
    let currentEmail = '';
    let currentMode = 'login'; // login, signup, otp-verify, forgot, reset
    let flow = 'login'; // login, signup, forgot

    function switchMode(mode) {
      currentMode = mode;
      const sections = ['loginForm', 'signupForm', 'otpForm', 'forgotForm', 'resetForm'];
      sections.forEach(s => document.getElementById(s).classList.add('auth-hidden'));
      
      document.getElementById('authSwitch').style.display = (mode === 'login' || mode === 'signup') ? 'grid' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');

      if (mode === 'login') {
        document.getElementById('loginForm').classList.remove('auth-hidden');
        setMeta('Welcome Back', 'Log in to track your repairs');
        flow = 'login';
      } else if (mode === 'signup') {
        document.getElementById('signupForm').classList.remove('auth-hidden');
        setMeta('Join RepairVafe', 'Create an account for faster booking');
        flow = 'signup';
      } else if (mode === 'otp') {
        document.getElementById('otpForm').classList.remove('auth-hidden');
        setMeta('Verify Identity', 'Enter code sent to ' + currentEmail);
      } else if (mode === 'forgot') {
        document.getElementById('forgotForm').classList.remove('auth-hidden');
        setMeta('Forgot Password?', 'Recover your account access');
        flow = 'forgot';
      } else if (mode === 'reset') {
        document.getElementById('resetForm').classList.remove('auth-hidden');
        setMeta('Reset Password', 'Create a new strong password');
      }
    }

    function setMeta(t, s) {
      document.getElementById('authTitle').textContent = t;
      document.getElementById('authSubtitle').textContent = s;
    }

    async function handleSignup(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('signupName').value,
        email: document.getElementById('signupEmail').value,
        phone: document.getElementById('signupPhone').value,
        password: document.getElementById('signupPass').value,
        address: document.getElementById('signupAddr').value,
        city: document.getElementById('signupCity').value,
        state: document.getElementById('signupState').value,
        pincode: document.getElementById('signupPin').value
      };
      currentEmail = payload.email;
      const res = await callApi('/register', payload);
      if (res.success) {
        showToast('OTP sent to ' + currentEmail, 'success');
        switchMode('otp');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        loginId: document.getElementById('loginId').value,
        password: document.getElementById('loginPass').value
      };
      currentEmail = payload.loginId.includes('@') ? payload.loginId : ''; // We'll get actual one from API if mobile used
      const res = await callApi('/login', payload);
      if (res.success) {
        currentEmail = res.data.email;
        showToast('OTP sent to your email', 'success');
        switchMode('otp');
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const loginId = document.getElementById('forgotId').value;
      const res = await callApi('/forgot-password', { loginId });
      if (res.success) {
        currentEmail = loginId; // Might need resolution if phone
        showToast('Reset OTP sent!', 'success');
        switchMode('otp');
      }
    }

    async function handleOTP(e) {
      e.preventDefault();
      const otp = document.getElementById('otpCode').value;
      let endpoint = '';
      if (flow === 'signup') endpoint = '/verify-registration';
      else if (flow === 'login') endpoint = '/verify-login';
      else if (flow === 'forgot') {
        switchMode('reset');
        return;
      }

      const res = await callApi(endpoint, { email: currentEmail, otp });
      if (res.success) {
        showToast('Authenticated!', 'success');
        if (res.token) localStorage.setItem('rv_user_token', res.token);
        setTimeout(() => window.location.href = '../../index.html', 1000);
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const pass = document.getElementById('resetPass').value;
      const conf = document.getElementById('resetPassConfirm').value;
      if (pass !== conf) return showToast('Passwords do not match', 'error');
      
      const res = await callApi('/reset-password', {
        email: currentEmail,
        otp: document.getElementById('otpCode').value,
        newPassword: pass
      });
      if (res.success) {
        showToast('Password changed!', 'success');
        switchMode('login');
      }
    }

    async function callApi(path, body) {
      try {
        const res = await fetch(API + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!data.success) showToast(data.message, 'error');
        return data;
      } catch (err) {
        showToast('Network error', 'error');
        return { success: false };
      }
    }

    function showToast(m, t) {
      const el = document.createElement('div');
      el.className = 'toast ' + t;
      el.textContent = m;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  </script>
</body>
</html>
