<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login - RepairVafe</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-grid">
    <div class="auth-left">
      <div class="auth-brand" onclick="window.location.href='../../index.html'" style="cursor:pointer">
        Repair<span>Vafe</span> Partner
      </div>
      <div class="auth-illustration">
        <div class="auth-mockup" style="transform: rotate(5deg) scale(1.1)">
          <div class="mockup-content">
            <h3 style="color:var(--clr-primary); margin-bottom:10px">Partner Portal</h3>
            <p>Access your assigned jobs, manage repairs, and track your completions.</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="auth-right">
      <div class="auth-form-container">
        <!-- Login Form -->
        <div id="loginForm" class="auth-form-step active">
          <div class="auth-header">
            <h2>Welcome Back, Partner</h2>
            <p>Enter your credentials to access the service portal</p>
          </div>
          
          <div class="form-group">
            <label class="form-label">Phone Number or Email</label>
            <div class="input-icon-wrapper">
              <span>👤</span>
              <input type="text" id="loginId" class="form-input" placeholder="Enter enrolled phone or email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-icon-wrapper">
              <span>🔒</span>
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password">
            </div>
            <div style="text-align: right; margin-top: 8px;">
               <a href="#" style="color:var(--clr-primary); font-size:0.8rem">Forgot Password?</a>
            </div>
          </div>

          <button class="btn btn-primary" style="width: 100%; margin-top:20px" onclick="partnerLogin()">Secure Login</button>
          
          <div style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--clr-text-muted)">
            Not enrolled yet? <span style="color: var(--clr-primary)">Contact Admin</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = (['localhost', '127.0.0.1', ''].includes(window.location.hostname)) ? 'http://localhost:5000/api' : '/api';

    async function partnerLogin() {
      const identifier = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!identifier || !password) {
        return showToast('Please enter both identifier and password', 'error');
      }

      const btn = document.querySelector('button');
      btn.textContent = 'Authenticating...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/technician-auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('rv_partner_token', data.token);
          showToast('Login Successful!', 'success');
          setTimeout(() => {
            window.location.href = 'partner-dashboard.html';
          }, 1000);
        } else {
          showToast(data.message || 'Login failed', 'error');
          btn.textContent = 'Secure Login';
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Server response error', 'error');
        btn.textContent = 'Secure Login';
        btn.disabled = false;
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const element = document.createElement('div');
      element.className = `toast ${type}`;
      element.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
      container.appendChild(element);
      setTimeout(() => element.remove(), 4000);
    }
  </script>
</body>
</html>
